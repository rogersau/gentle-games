name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  shared-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Shared checks
        run: npm run ci:shared

  platform-exports:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: web
            command: npm run build:web
          - platform: android
            command: npm run validate:android
          - platform: ios
            command: npm run validate:ios
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate ${{ matrix.platform }} export
        run: ${{ matrix.command }}
